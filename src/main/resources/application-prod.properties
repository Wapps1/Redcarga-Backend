spring.application.name=redcarga

# --- Datasource desde ENV ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=16

app.iam.verification-continue-url=${APP_IAM_VERIFICATION_CONTINUE_URL:https://redcarga-api-hreje3evg6engcd5.canadacentral-01.azurewebsites.net/iam/email-verification/continue}
app.iam.signup-intent-ttl-seconds=86400
app.iam.verification-resend-cooldown-seconds=60

# --- JPA/Flyway ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# --- IAM/Firebase (secretos montados o ENV) ---
iam.jwt.enabled=true
iam.jwt.issuer=${IAM_JWT_ISSUER:https://<tu-appservice>.azurewebsites.net/iam}
iam.jwt.audience=redcarga-clients
iam.jwt.public-key-location=${IAM_PUBLIC_KEY_LOCATION:file:/run/secrets/iam/iam_public.pem}
iam.jwt.private-key-location=${IAM_PRIVATE_KEY_LOCATION:file:/run/secrets/iam/iam_private.pem}

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://securetoken.google.com/redcarga-ca1e1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com

app.firebase.project-id=redcarga-ca1e1
app.firebase.credentials-file=file:/run/secrets/firebase/firebase-admin.json

# --- CORS / WS ---
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,X-Tenant-Id

redcarga.ws.allowed-origins=http://localhost:3000,http://localhost:5173
redcarga.ws.heartbeat.server-ms=10000
redcarga.ws.heartbeat.client-ms=10000
redcarga.ws.message-size.max-bytes=65536

# --- Measurements ---
redcarga.measurements.base-url=https://measures-production.up.railway.app
redcarga.measurements.timeout-ms=10000

# --- Actuator/Health ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# --- Logging ---
logging.level.root=INFO
logging.level.com.app.redcarga=INFO

# --- Network/Perf ---
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.compression.enabled=true
server.http2.enabled=true

# --- Error responses ---
server.error.include-message=never
server.error.include-stacktrace=never

# --- Swagger en prod: on ---
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=redcargademo@gmail.com
spring.mail.password=pbowdigrohsuzlvx
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.default-encoding=UTF-8
spring.mail.from=redcargademo@gmail.com

requests.outbox.match.enabled=true
requests.outbox.match.batch-size=50
requests.outbox.match.lease=30s
requests.outbox.match.backoff=30s
requests.outbox.match.max-attempts=8
requests.outbox.match.cron=*/5 * * * * *
requests.outbox.match.also-fire-after-commit=true