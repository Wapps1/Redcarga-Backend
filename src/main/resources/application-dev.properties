# IAM SIEMPRE ON
iam.jwt.enabled=true

# Debe ser EXACTAMENTE igual al 'iss' que ponen tus tokens IAM
iam.jwt.issuer=http://localhost:8080/iam

# Debe existir en el token (claim 'aud'); si no lo pones en el token, quita el validador de audience o ajusta este valor
