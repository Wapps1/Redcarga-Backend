# Ruta a la PUBLIC KEY (para validar). Mejor fuera del jar.
iam.jwt.public-key-location=file:./.secrets/iam/dev/iam_public.pem
iam.jwt.private-key-location=file:./.secrets/iam/dev/iam_private.pem
